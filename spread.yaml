project: valkey-rock

backends:
  craft:
    type: craft
    systems:
      - ubuntu-26.04:
      #- ubuntu-22.04:

suites:
  spread/general/:
    summary: General integration tests

    prepare: |
      sudo snap install docker

      # For 'rockcraft.skopeo'
      sudo snap install --classic rockcraft --edge

      # Wait for docker daemon to come online
      sudo apt install --yes retry
      retry --times=10 --delay 2 -- docker run hello-world
      sudo apt remove --yes retry

      # Load the rock into docker
      rockcraft.skopeo --insecure-policy copy "oci-archive:$CRAFT_ARTIFACT" docker-daemon:valkey:spreadtest
    prepare-each: |
      docker run -d --rm -p 6379:6379 --name "${SPREAD_TASK//\//_}" valkey:spreadtest
      sleep 5 # Wait for pebble to bootstrap and launch the service
    restore-each: |
      docker kill "${SPREAD_TASK//\//_}" || true
    restore: |
      docker image rm --force valkey:spreadtest

exclude:
  - .git

kill-timeout: 1h
