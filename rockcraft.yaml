---
name: valkey
base: ubuntu@26.04
version: "9.1.0"
summary: Valkey ROCK OCI
description: |
  This is an OCI image that bundles Valkey together with the metrics exporter
  in order to be used in Operators, providing automated operations 
  management from day 0 to day 2 on Valkey, on top of a Virtual Machine cluster 
  and K8s cluster. It is an open source, end-to-end, production ready data 
  platform on top of cloud native technologies.
license: Apache-2.0
platforms:
  amd64:
  arm64:

run-user: _daemon_

package-repositories:
  - type: apt
    components: [main]
    suites: [resolute]
    key-id: 6676E3F1A76ADBE4488944BF7D1A96D4BF78C79E
    url: https://ppa.launchpadcontent.net/data-platform/prometheus-redis-exporter/ubuntu

services:
  valkey:
    override: replace
    startup: enabled
    summary: Start Valkey
    command: "valkey-server --dir /var/lib/valkey"
  metric_exporter:
    override: replace
    startup: enabled
    summary: Start Metrics Exporter
    command: "/bin/prometheus-redis-exporter"

parts:
  valkey:
    plugin: nil
    stage-snaps:
      - valkey/9.1-26.04/edge
    stage-packages:
      - openssl
      - prometheus-redis-exporter
    override-stage: |
      craftctl default
      actual=$(${CRAFT_STAGE}/usr/bin/valkey-server --version | grep -oP '(?<=v=)[0-9.]+')
      if [ "$actual" != "$CRAFT_PROJECT_VERSION" ]; then
        echo "ERROR: binary version ($actual) does not match declared version ($CRAFT_PROJECT_VERSION)"
        exit 1
      fi
      echo "Version check passed: $actual"
  valkey-user:
    plugin: nil
    after:
      - valkey
    override-build: |
      mkdir -p ${CRAFT_PART_INSTALL}/var/lib/valkey
      chown -R 584788:584788 ${CRAFT_PART_INSTALL}/var/lib/valkey
